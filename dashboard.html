<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DRISHTI - Live Situation Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        #map { height: 420px; border-radius: 6px; cursor: crosshair; }
        .table-container { max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; position: sticky; top: 0; background: #1e293b; }
        .LOW { color: #22c55e; font-weight: bold; }
        .MODERATE { color: #eab308; font-weight: bold; }
        .HIGH { color: #f97316; font-weight: bold; }
        .CRITICAL { color: #ef4444; font-weight: bold; }
        .popup-content { font-size: 14px; color: #0f172a; }
    </style>
</head>
<body>

    <h2>DRISHTI: Early Warning & Environmental Command Center</h2>
    
    <div class="grid">
        <div>
            <div class="card">
                <h3>Live Situation Map</h3>
                <div id="map"></div>
            </div>
            <div class="card">
                <h3 id="chart-title">Hydrological Trends</h3>
                <canvas id="trendChart" height="100"></canvas>
            </div>
        </div>
        <div>
            <div class="card">
                <h3>Risk Distribution</h3>
                <canvas id="pieChart" height="180"></canvas>
            </div>
            <div class="card">
                <h3>Regional Risk Status</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Location</th><th>Risk</th></tr></thead>
                        <tbody id="risk-table-body">
                            <tr><td colspan="2">Loading stations...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = "https://sih26178-1.onrender.com"; 
        
        const map = L.map('map').setView([22.90, 78.96], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        
        let markers = [];
        let allNodes = [];

        const pieCtx = document.getElementById('pieChart').getContext('2d');
        const pieChart = new Chart(pieCtx, {
            type: 'pie',
            data: {
                labels: ['Critical', 'High', 'Moderate', 'Low'],
                datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e'] }]
            },
            options: { plugins: { legend: { labels: { color: '#f8fafc' } } } }
        });

        const trendCtx = document.getElementById('trendChart').getContext('2d');
        const trendChart = new Chart(trendCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Water Level (cm)', data: [], borderColor: '#38bdf8', tension: 0.2, backgroundColor: 'rgba(56, 189, 248, 0.1)', fill: true }] },
            options: { 
                scales: { 
                    x: { ticks: { color: '#94a3b8' } },
                    y: { ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { labels: { color: '#f8fafc' } } }
            }
        });

        map.on('moveend', updateVisibleStats);

        function updateVisibleStats() {
            if (allNodes.length === 0) return;
            
            const bounds = map.getBounds();
            let counts = { CRITICAL: 0, HIGH: 0, MODERATE: 0, LOW: 0 };
            let tableHtml = "";
            let visibleCount = 0;

            allNodes.forEach(node => {
                const latlng = L.latLng(node.lat, node.lon);
                if (bounds.contains(latlng)) {
                    counts[node.risk_level] = (counts[node.risk_level] || 0) + 1;
                    tableHtml += `<tr><td>${node.location_name || node.node_id}</td><td class="${node.risk_level}">${node.risk_level}</td></tr>`;
                    visibleCount++;
                }
            });

            if (visibleCount === 0) {
                tableHtml = `<tr><td colspan="2">No stations found in this area</td></tr>`;
            }

            document.getElementById('risk-table-body').innerHTML = tableHtml;
            pieChart.data.datasets[0].data = [counts.CRITICAL, counts.HIGH, counts.MODERATE, counts.LOW];
            pieChart.update();
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            
            let nearest = null;
            let minDist = Infinity;
            
            allNodes.forEach(node => {
                let dist = Math.pow(node.lat - lat, 2) + Math.pow(node.lon - lon, 2);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = node;
                }
            });

            let content = `<div class="popup-content"><b>Coordinates:</b><br>${lat.toFixed(4)}, ${lon.toFixed(4)}<br><br>`;
            
            if (nearest) {
                content += `<b>Nearest Station:</b> ${nearest.location_name}<br>
                            <b>Water Level:</b> ${nearest.water_cm} cm<br>
                            <b>Flood Risk:</b> <span class="${nearest.risk_level}">${nearest.risk_level}</span>`;
            } else {
                content += `No nearby station data available.`;
            }
            content += `</div>`;

            L.popup().setLatLng(e.latlng).setContent(content).openOn(map);
        });

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/api/nodes`);
                const data = await res.json();
                if (!data.success) return;

                allNodes = data.nodes;

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const colorMap = { CRITICAL: '#ef4444', HIGH: '#f97316', MODERATE: '#eab308', LOW: '#22c55e' };

                allNodes.forEach(node => {
                    const marker = L.circleMarker([node.lat, node.lon], {
                        radius: 8, color: colorMap[node.risk_level] || '#22c55e', fillOpacity: 0.8
                    }).addTo(map).bindPopup(`<div class="popup-content"><b>${node.location_name}</b><br>Water: ${node.water_cm} cm<br>Risk: <span class="${node.risk_level}">${node.risk_level}</span></div>`);
                    
                    marker.on('click', () => loadHistory(node.node_id, node.location_name));
                    markers.push(marker);
                });

                updateVisibleStats();

                if (allNodes.length > 0 && trendChart.data.labels.length === 0) {
                    const criticalNode = allNodes.find(n => n.risk_level === 'CRITICAL') || allNodes[0];
                    loadHistory(criticalNode.node_id, criticalNode.location_name);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadHistory(nodeId, locName) {
            try {
                const res = await fetch(`${API_BASE}/api/nodes/${nodeId}/history`);
                const data = await res.json();
                if (!data.success) return;

                document.getElementById('chart-title').innerText = `Hydrological Trends: ${locName}`;
                trendChart.data.labels = data.history.map(h => new Date(h.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
                trendChart.data.datasets[0].data = data.history.map(h => h.water_cm);
                trendChart.update();
            } catch (err) {
                console.error(err);
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 15000);
    </script>
</body>
</html>
