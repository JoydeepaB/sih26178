<!DOCTYPE html>
<html>
<head>
    <title>SIH26178 Intelligence Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0b0f1a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .danger-zone { background: #7f1d1d; color: white; padding: 10px; text-align: center; font-weight: bold; display: none; margin-bottom: 15px; border-radius: 5px; animation: flash 1.5s infinite; }
        @keyframes flash { 0% {opacity:1} 50% {opacity:0.6} 100% {opacity:1} }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #161e2d; padding: 15px; border-radius: 8px; border: 1px solid #2d3748; }
        .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        #map-box { height: 450px; border-radius: 8px; border: 1px solid #2d3748; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2d3748; }
        .CRITICAL { color: #ef4444; font-weight: bold; }
        .HIGH { color: #f97316; font-weight: bold; }
        .MODERATE { color: #facc15; }
        .LOW { color: #4ade80; }
        .ai-tag { background: #38bdf8; color: #0b0f1a; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="banner" class="danger-zone">ACTIVE EMERGENCY: PREDICTIVE MODELS INDICATE CRITICAL FLOOD RISK</div>

    <div class="stats-bar">
        <div class="stat-card">System Logs<div style="font-size: 24px; color: #38bdf8;" id="logs">0</div></div>
        <div class="stat-card">Active Alerts<div style="font-size: 24px; color: #f87171;" id="warns">0</div></div>
        <div class="stat-card">SOS Signals<div style="font-size: 24px; color: #facc15;" id="sos-count">0</div></div>
        <div class="stat-card">Network Health<div style="font-size: 24px; color: #4ade80;">OPTIMAL</div></div>
    </div>

    <div class="layout">
        <div>
            <div class="stat-card">
                <h3>Regional Intelligence Map</h3>
                <div id="map-box"></div>
            </div>
            <div class="stat-card" style="margin-top: 20px;">
                <h3>Historical Trend: <span id="chart-node-name">Select a Node</span></h3>
                <canvas id="history-chart" height="100"></canvas>
            </div>
        </div>
        <div>
            <div class="stat-card">
                <h3>Live Risk Distribution</h3>
                <canvas id="risk-pie" height="150"></canvas>
            </div>
            <div class="stat-card" style="margin-top: 20px;">
                <h3>Telemetry Feed</h3>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table id="telemetry">
                        <thead><tr><th>Location</th><th>Risk</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="stat-card" style="margin-top: 20px;">
                <h3>Emergency SOS Dispatch</h3>
                <div id="sos-feed" style="max-height: 150px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_ROOT = "https://sih26178-1.onrender.com";
        const map = L.map('map-box').setView([23.8, 91.2], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        
        let histChart, riskPie;
        const markers = {};

        async function refresh() {
            try {
                const sRes = await fetch(`${API_ROOT}/api/statistics`);
                const s = (await sRes.json()).statistics;
                document.getElementById('logs').innerText = s.total_readings;
                document.getElementById('warns').innerText = s.total_alerts;

                const nRes = await fetch(`${API_ROOT}/api/nodes`);
                const nodes = (await nRes.json()).nodes;
                const tbody = document.querySelector('#telemetry tbody');
                tbody.innerHTML = "";
                
                let danger = false;
                let riskCounts = { CRITICAL: 0, HIGH: 0, MODERATE: 0, LOW: 0 };

                nodes.forEach(n => {
                    if(n.risk_level === "CRITICAL") danger = true;
                    riskCounts[n.risk_level]++;
                    
                    tbody.innerHTML += `<tr style="cursor:pointer" onclick="updateChart('${n.node_id}', '${n.location_name}')">
                        <td><b>${n.location_name}</b></td>
                        <td class="${n.risk_level}">${n.risk_level}</td>
                    </tr>`;
                    updateMarker(n);
                });

                updatePie(riskCounts);
                document.getElementById('banner').style.display = danger ? 'block' : 'none';

                const sosRes = await fetch(`${API_ROOT}/api/sos`);
                const sosList = (await sosRes.json()).sos;
                document.getElementById('sos-count').innerText = sosList.length;
                document.getElementById('sos-feed').innerHTML = sosList.map(item => `
                    <div style="border-bottom: 1px solid #333; padding: 10px;">
                        <b style="color:red">SOS</b> <b>${item.device_id}</b><br>
                        <small>${new Date(item.timestamp*1000).toLocaleTimeString()}</small>
                    </div>`).join("");
                
                sosList.forEach(s => L.circle([s.latitude, s.longitude], {color:'red', radius:1000}).addTo(map));
                if(nodes.length > 0 && !histChart) updateChart(nodes[0].node_id, nodes[0].location_name);

            } catch(e) {}
        }

        function updateMarker(n) {
            const color = n.risk_level === "CRITICAL" ? "red" : n.risk_level === "HIGH" ? "orange" : "green";
            if (!markers[n.node_id]) {
                markers[n.node_id] = L.circleMarker([n.lat, n.lon], { radius: 8, color: color, fillOpacity: 0.8 }).addTo(map);
            }
            markers[n.node_id].setStyle({ color: color }).bindPopup(`<b>${n.location_name}</b><br>Risk: ${n.risk_level}`);
        }

        function updatePie(counts) {
            const ctx = document.getElementById('risk-pie').getContext('2d');
            const data = {
                labels: ['Critical', 'High', 'Mod', 'Low'],
                datasets: [{
                    data: [counts.CRITICAL, counts.HIGH, counts.MODERATE, counts.LOW],
                    backgroundColor: ['#ef4444', '#f97316', '#facc15', '#4ade80'],
                    borderWidth: 0
                }]
            };
            if (riskPie) riskPie.destroy();
            riskPie = new Chart(ctx, { type: 'pie', data, options: { plugins: { legend: { position: 'bottom', labels: {color: '#fff'} } } } });
        }

        async function updateChart(id, name) {
            document.getElementById('chart-node-name').innerText = name;
            const res = await fetch(`${API_ROOT}/api/nodes/${id}/history`);
            const h = (await res.json()).history.slice(-30);
            const ctx = document.getElementById('history-chart').getContext('2d');
            const data = {
                labels: h.map(i => new Date(i.timestamp*1000).toLocaleTimeString()),
                datasets: [{ label: 'Water Level (cm)', data: h.map(i => i.water_cm), borderColor: '#38bdf8', tension: 0.4, fill: true, backgroundColor: 'rgba(56, 189, 248, 0.1)' }]
            };
            if (histChart) histChart.destroy();
            histChart = new Chart(ctx, { type: 'line', data, options: { scales: { y: { grid: {color: '#334155'} } } } });
        }

        setInterval(refresh, 10000);
        refresh();
    </script>
</body>
</html>
