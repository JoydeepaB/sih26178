<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRISHTI - Live Situation Update</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(16, 24, 40, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }
    
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo-container { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff;
    }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
    .title-group p { font-size: 0.75rem; color: var(--text-muted); }
    
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success); font-size: 0.8rem; font-weight: 600;
    }
    .pulse-dot {
      width: 8px; height: 8px; background: var(--success);
      border-radius: 50%; box-shadow: 0 0 10px var(--success);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 360px 1fr 340px;
      gap: 18px;
      padding: 20px;
      height: calc(100vh - 72px);
    }
    @media (max-width: 1280px) {
      .dashboard-grid { grid-template-columns: 1fr; height: auto; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .panel-body { padding: 16px; overflow-y: auto; flex: 1; }

    .station-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .station-card:hover { border-color: var(--accent); background: rgba(6, 182, 212, 0.05); }
    .station-card.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
    
    .stn-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .stn-name { font-size: 0.88rem; font-weight: 600; }
    .badge {
      padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    }
    .badge-normal { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .stn-metrics { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.78rem; }
    .weather-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; padding: 2px 8px; border-radius: 4px;
      background: rgba(6, 182, 212, 0.12); color: var(--accent); margin-top: 6px;
    }

    #map { width: 100%; height: 55%; border-radius: 12px; border: 1px solid var(--border); }
    .chart-box { height: 45%; margin-top: 16px; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 12px; }

    .btn-surge {
      width: 100%; padding: 12px; border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #f97316);
      border: none; color: white; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transition: transform 0.15s ease;
      margin-bottom: 14px;
    }
    .btn-surge:hover { transform: translateY(-2px); }

    .alert-item {
      padding: 12px; border-radius: 10px; margin-bottom: 10px;
      border-left: 4px solid var(--border); background: rgba(255, 255, 255, 0.02);
      font-size: 0.78rem; line-height: 1.4;
    }
    .alert-CRITICAL { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.08); }
    .alert-WARNING { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.08); }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon"><i class="fa-solid fa-water"></i></div>
      <div class="title-group">
        <h1>DRISHTI • Early Warning System</h1>
        <p>National Hydro-Meteorological Monitoring Network</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      <span>LIVE METEO FEED</span>
    </div>
  </header>

  <div class="dashboard-grid">
    <div class="panel">
      <div class="panel-header">
        <span><i class="fa-solid fa-tower-broadcast"></i> Gauging Stations</span>
        <span id="stn-count" style="color: var(--accent);">Active</span>
      </div>
      <div class="panel-body">
        <button class="btn-surge" onclick="triggerSurge()">
          <i class="fa-solid fa-bolt"></i> Simulate High Water Surge
        </button>
        <div id="station-list">
          <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px;">
            Loading station data...
          </p>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span><i class="fa-solid fa-map-location-dot"></i> Basin Map</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Real-time Telemetry</span>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="map"></div>
        <div class="chart-box">
          <canvas id="hydroChart"></canvas>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span><i class="fa-solid fa-triangle-exclamation"></i> Active Alerts</span>
        <span style="font-size: 0.72rem; color: var(--text-muted);">Threshold Monitoring</span>
      </div>
      <div class="panel-body" id="alert-feed">
        <p style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding-top: 30px;">
          Listening for alerts...
        </p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Determine backend address based on host
    const API_BASE = window.location.hostname.includes("onrender.com")
      ? window.location.origin
      : "http://localhost:5000";

    let map, markers = {}, hydroChart;
    let selectedNode = "NODE_CWC_01";

    function initMap() {
      map = L.map('map').setView([22.5937, 78.9629], 5);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 18
      }).addTo(map);
    }

    function initChart() {
      const ctx = document.getElementById('hydroChart').getContext('2d');
      hydroChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Water Level (m)',
            data: [],
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            fill: true,
            tension: 0.35,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: { display: true, text: 'Recent Water Level Trend (m)', color: '#9ca3af', font: { size: 11 } }
          },
          scales: {
            x: { ticks: { color: '#6b7280', font: { size: 9 }, maxTicksLimit: 8 }, grid: { display: false } },
            y: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }

    async function fetchLiveData() {
      try {
        const res = await fetch(`${API_BASE}/api/live`);
        const data = await res.json();
        renderStations(data);
        updateMap(data);
      } catch (err) {
        console.warn("Could not fetch live telemetry:", err);
      }
    }

    function renderStations(stations) {
      const list = document.getElementById("station-list");
      list.innerHTML = "";
      
      stations.forEach(stn => {
        const card = document.createElement("div");
        card.className = `station-card ${stn.node_id === selectedNode ? 'active' : ''}`;
        card.onclick = () => selectStation(stn.node_id);

        const rain = stn.rainfall_mm !== undefined ? Number(stn.rainfall_mm).toFixed(1) : "0.0";

        card.innerHTML = `
          <div class="stn-header">
            <div>
              <div class="stn-name">${stn.location_name}</div>
              <div class="weather-pill"><i class="fa-solid fa-cloud-rain"></i> ${rain} mm/hr rain</div>
            </div>
            <span class="badge badge-${stn.risk_level.toLowerCase()}">${stn.risk_level}</span>
          </div>
          <div class="stn-metrics">
            <span>Water: <b>${stn.water_cm.toFixed(2)} m</b></span>
            <span>Risk Score: <b>${stn.risk_score}/100</b></span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function updateMap(stations) {
      stations.forEach(stn => {
        const color = stn.risk_level === 'CRITICAL' ? '#ef4444' : (stn.risk_level === 'WARNING' ? '#f59e0b' : '#10b981');
        const rain = stn.rainfall_mm !== undefined ? Number(stn.rainfall_mm).toFixed(1) : "0.0";

        if (markers[stn.node_id]) {
          markers[stn.node_id].setLatLng([stn.lat, stn.lon]);
          markers[stn.node_id].setStyle({ fillColor: color, color: color });
        } else {
          const marker = L.circleMarker([stn.lat, stn.lon], {
            radius: 9,
            fillColor: color,
            color: color,
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map);
          
          marker.bindPopup(`
            <b style="color: #111;">${stn.location_name}</b><br/>
            Water Level: <b>${stn.water_cm.toFixed(2)} m</b><br/>
            Rain: <b>${rain} mm/hr</b><br/>
            Status: <b>${stn.risk_level}</b>
          `);
          marker.on('click', () => selectStation(stn.node_id));
          markers[stn.node_id] = marker;
        }
      });
    }

    async function selectStation(node_id) {
      selectedNode = node_id;
      document.querySelectorAll('.station-card').forEach(c => c.classList.remove('active'));
      
      try {
        const res = await fetch(`${API_BASE}/api/history?node_id=${node_id}&limit=25`);
        const history = await res.json();
        
        const labels = history.map(h => new Date(h.timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        const depths = history.map(h => h.water_cm);

        hydroChart.data.labels = labels;
        hydroChart.data.datasets[0].data = depths;
        hydroChart.update();
      } catch (e) {
        console.error("Could not fetch history:", e);
      }
    }

    async function fetchAlerts() {
      try {
        const res = await fetch(`${API_BASE}/api/alerts`);
        const alerts = await res.json();
        const feed = document.getElementById("alert-feed");
        
        if (alerts.length === 0) {
          feed.innerHTML = `<p style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding-top: 30px;">All stations within normal operating limits.</p>`;
          return;
        }

        feed.innerHTML = alerts.slice(0, 15).map(a => `
          <div class="alert-item alert-${a.risk_level}">
            <div style="font-weight: 600; margin-bottom: 2px;">${a.risk_level} Level</div>
            <div>${a.message}</div>
            <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 4px;">
              ${new Date(a.timestamp * 1000).toLocaleTimeString()}
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.warn("Could not fetch alerts:", err);
      }
    }

    async function triggerSurge() {
      try {
        await fetch(`${API_BASE}/api/demo-surge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ node_id: "ALL", duration_seconds: 90 })
        });
        fetchLiveData();
        fetchAlerts();
      } catch (e) {
        console.error("Surge trigger error:", e);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      initChart();
      fetchLiveData();
      fetchAlerts();
      selectStation(selectedNode);

      // Periodic poll
      setInterval(fetchLiveData, 10000);
      setInterval(fetchAlerts, 15000);
      setInterval(() => selectStation(selectedNode), 12000);
    });
  </script>
</body>
</html>
